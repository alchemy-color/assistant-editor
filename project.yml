name: Assistant Editor
options:
  bundleIdPrefix: com.assistanteditor
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    INFOPLIST_FILE: AssistantEditor/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.assistanteditor.transcripts
    CODE_SIGN_STYLE: Automatic

targets:
  Assistant Editor:
    type: application
    platform: macOS
    sources:
      - path: AssistantEditor
    settings:
      base:
        INFOPLIST_FILE: AssistantEditor/Info.plist
        PRODUCT_NAME: "Assistant Editor"
    dependencies:
      - sdk: libsqlite3.tbd
    preBuildScripts:
      - name: Copy Python Scripts
        script: |
          rsync -av --delete "$SRCROOT/Scripts/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Scripts/"
        basedOnDependencyAnalysis: false
